
services:
  # PostgreSQL 数据库服务
  # 注意: 如果您想使用服务器上已有的共享 PostgreSQL 容器，
  # 可以注释掉整个 postgres 服务配置，并在 fastify 和 shadcn-next 服务中
  # 将 POSTGRES_HOST 环境变量指向该共享容器的主机名或 IP
  postgres:
    image: postgres:17-alpine
    container_name: fastify-postgres-17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      # 使用项目特定的卷名称，避免与其他项目冲突
      - pg-17-data:/var/lib/postgresql/data
      # 初始化脚本目录，可以放置 .sql 文件进行初始化
      - ./db_init_scripts:/docker-entrypoint-initdb.d
    ports:
      - '${EXPORT_PG_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastify-network

  # Fastify 后端服务
  fastify:
    build:
      context: .
      dockerfile: services/fastify/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PRISMA_ENGINES_MIRROR: ${PRISMA_ENGINES_MIRROR:-https://cdn.npmmirror.com/binaries/prisma}
    container_name: fastify-service
    restart: unless-stopped
    ports:
      - '${EXPORT_FASTIFY_PORT:-4000}:3100'
    environment:
      - NODE_ENV=${DOCKER_NODE_ENV:-production}
      - PRISMA_ENGINES_MIRROR=${PRISMA_ENGINES_MIRROR:-https://cdn.npmmirror.com/binaries/prisma}
      - PORT=3100
      - FASTIFY_CLOSE_GRACE_DELAY=${FASTIFY_CLOSE_GRACE_DELAY:-500}
      - BEARER_TOKEN=${BEARER_TOKEN}
      # API 前缀配置（生产环境使用 /fastify，开发环境留空）
      - API_PREFIX=${API_PREFIX:-/fastify}
      # 数据库连接配置（由 POSTGRES_* 拼接，密码单一来源）
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/fastify_db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      # Jira 配置
      - JIRA_USERNAME=${JIRA_USERNAME}
      - JIRA_PASSWORD=${JIRA_PASSWORD}
      - JIRA_BASE_URL=${JIRA_BASE_URL}
      - JIRA_PROXY_AUTH=${JIRA_PROXY_AUTH}
      - JIRA_ASSIGNEE_USER=${JIRA_ASSIGNEE_USER}
      - JIRA_DEFAULT_PROJECT=${JIRA_DEFAULT_PROJECT}
      - JIRA_DEFAULT_ISSUE_TYPE=${JIRA_DEFAULT_ISSUE_TYPE}
      - JIRA_DEFAULT_COMPONENT=${JIRA_DEFAULT_COMPONENT}
      - JIRA_DEFAULT_PRIORITY=${JIRA_DEFAULT_PRIORITY}
      # 大模型
      - LLM_MODEL=${LLM_MODEL:-qwen3.5-flash}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      - LLM_API_KEY=${LLM_API_KEY}
      # Pages 静态站点部署（写入宿主机目录供 nginx 泛域名站点使用）
      - PAGES_SITES_DIR=/srv/pages-sites
      - PAGES_BASE_DOMAIN=${PAGES_BASE_DOMAIN:-pages.delldiagi.top}
      # 邮箱服务
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_SECURE=${SMTP_SECURE}  
    volumes:
      # Pages 站点产物目录：容器写入 → 宿主机 nginx 泛域名站点读取
      - /srv/pages-sites:/srv/pages-sites
      # 宿主机网络计数器（/host/proc/net/dev 全机流量）
      - /proc:/host/proc:ro
      # 容器列表监控（docker.sock 等价宿主机 root，仅查询用途）
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fastify-network

  # Next.js 前端服务
  shadcn-next:
    build:
      context: .
      dockerfile: packages/shadcn-next/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PRISMA_ENGINES_MIRROR: ${PRISMA_ENGINES_MIRROR:-https://cdn.npmmirror.com/binaries/prisma}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/next}
        NEXT_PUBLIC_API_URL: ${DOCKER_NEXT_PUBLIC_API_URL:-/fastify}
        NEXT_PUBLIC_FAST_API_URL: ${NEXT_PUBLIC_FAST_API_URL}
        NEXT_PUBLIC_FAST_API_KEY: ${NEXT_PUBLIC_FAST_API_KEY:-your_fastapi_key}
    container_name: shadcn-next
    restart: unless-stopped
    ports:
      - '${EXPORT_NEXT_PORT:-4001}:3200'
    environment:
      - NODE_ENV=${DOCKER_NODE_ENV:-production}
      - PRISMA_ENGINES_MIRROR=${PRISMA_ENGINES_MIRROR:-https://cdn.npmmirror.com/binaries/prisma}
      - SITE_DOMAIN_URL=${SITE_DOMAIN_URL}
      - SERVER_FASTIFY_API=${DOCKER_SERVER_FASTIFY_API:-http://fastify:3100/fastify}
      # 数据库连接配置（由 POSTGRES_* 拼接，密码单一来源）
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/shadcn_next
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JIRA_USERNAME=${JIRA_USERNAME:?JIRA_USERNAME is required}
      - JIRA_PASSWORD=${JIRA_PASSWORD:?JIRA_PASSWORD is required}
      - INITIAL_USER_PASSWORD=${INITIAL_USER_PASSWORD}
      - INITIAL_SUPER_PASSWORD=${INITIAL_SUPER_PASSWORD}
      - BEARER_TOKEN=${BEARER_TOKEN}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      - postgres
      - fastify
    networks:
      - fastify-network

# 使用项目特定的卷名称，避免与其他项目冲突
volumes:
  pg-17-data:
    # 如果需要使用外部卷（如共享给其他项目），可以添加 external: true
    # external: true

# 网络配置
# 如果需要连接到外部网络（如共享的 PostgreSQL 容器所在的网络），可以添加 external: true
networks:
  fastify-network:
    driver: bridge
    # external: true
